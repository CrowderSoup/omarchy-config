# Omarchy's default look (bold cyan, arrow prompt) with language-runtime
# segments and a command-duration indicator layered on top.

add_newline = true
command_timeout = 200

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$ruby\
$golang\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style) '
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[nodejs]
detect_files = ["package.json", ".node-version"]
format = "[$symbol($version )]($style)"

[python]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]
format = "[$symbol($version )]($style)"

[ruby]
detect_files = ["Gemfile", ".ruby-version"]
format = "[$symbol($version )]($style)"

[golang]
detect_files = ["go.mod"]
format = "[$symbol($version )]($style)"

[rust]
detect_files = ["Cargo.toml"]
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold cyan)"
